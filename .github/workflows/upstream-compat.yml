name: Upstream compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 0'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Merge upstream in the disposable runner
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream-check https://github.com/MoonshotAI/kimi-code.git
          git fetch --no-tags upstream-check main
          set +e
          git merge --no-commit --no-ff upstream-check/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          unexpected="$(printf '%s\n' "$conflicts" | grep -v '^README.md$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Upstream conflicts require maintenance:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          if printf '%s\n' "$conflicts" | grep -qx 'README.md'; then
            git checkout --ours -- README.md
            git add README.md
          fi
          if [[ -n "$(git diff --name-only --diff-filter=U)" || $merge_status -ne 0 && -z "$conflicts" ]]; then
            echo 'Upstream merge did not reach a testable state.' >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Run the plugin hook Vitest
        run: pnpm exec vitest run apps/kimi-code/test/utils/multi-model-swarm-hook.test.ts

      - name: Build the CLI
        run: pnpm -C apps/kimi-code run build

      - name: Check doctor JSON
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('apps/kimi-code/package.json', 'utf8')).version")"
          output="$(KIMI_CODE_CAPABILITIES=agent-swarm-item-models-v1 KIMI_CODE_SWARM_VERSION="$version" node plugins/multi-model-swarm/bin/doctor.mjs --json)"
          node -e '
            const result = JSON.parse(process.argv[1]);
            if (!result.capabilityAvailable || !result.versionMatch) process.exit(1);
          ' "$output"
